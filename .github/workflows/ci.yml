name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform test
      - run: pip install yamllint==1.38.0
      - run: yamllint .
      - run: pip install ansible-core==2.21.4 ansible-lint==26.9.0
      - run: ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
      - run: ansible-lint
        working-directory: ansible
