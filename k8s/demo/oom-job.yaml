apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Allocates memory in 8 MiB steps, logging each one, until the 64 MiB limit kills it.
# Every run behaves the same, which is what a repeatable demo needs.
apiVersion: batch/v1
kind: Job
metadata:
  name: oom-demo
  namespace: demo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      restartPolicy: Never
      containers:
        - name: hog
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              held = []
              for step in range(1, 1000):
                  # bytes * n writes every page, so the memory is really resident
                  held.append(b"\x01" * (8 * 1024 * 1024))
                  print(f"allocated {step * 8} MiB", flush=True)
                  time.sleep(0.5)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
