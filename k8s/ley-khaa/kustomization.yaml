apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ley-khaa
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: ley-khaa
# The one place the deployed ley-khaa version is set.
images:
  - name: ghcr.io/ruttantai/ley-khaa-backend
    newTag: "1.0.1"
  - name: ghcr.io/ruttantai/ley-khaa-frontend
    newTag: "1.0.1"
