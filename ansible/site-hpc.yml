# The HPC stack (spec docs/superpowers/specs/2026-10-12-hpc-slurm-design.md). Run through
# scripts/hpc-run.sh (make hpc-configure), never directly: it holds Slurm's power saving first.
- name: HPC baseline on every node
  hosts: hpc
  become: true
  roles:
    - role: common
      vars:
        common_k3s_rules: false
    - hpc_hosts
    - hpc_firewall
    - munge
    - nfs
    - slurm_common
    - lmod

- name: Compute nodes
  hosts: hpc_compute
  become: true
  roles:
    - slurm_node

# No play after this one targets the compute nodes, so once slurmctld can power them off
# (Task 6) nothing later in the run needs to reach them (spec §10.4).
- name: Head node
  hosts: hpc_head
  become: true
  roles:
    - slurm_head
    - spack
