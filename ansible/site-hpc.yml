# The HPC stack (spec docs/superpowers/specs/2026-10-12-hpc-slurm-design.md). Run through
# scripts/hpc-run.sh (make hpc-configure), never directly: it holds Slurm's power saving first.
- name: HPC baseline on every node
  hosts: hpc
  become: true
  roles:
    - role: common
      vars:
        common_k3s_rules: false
    - hpc_hosts
    - hpc_firewall
    - munge
    - nfs
