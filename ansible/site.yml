- name: Baseline every node
  hosts: all
  become: true
  roles:
    - common

- name: Control plane
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Workers
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent

- name: Cluster workloads
  hosts: k3s_server
  become: true
  roles:
    - k8s_tooling
    - ley_khaa
