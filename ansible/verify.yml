# Assertions about the running cluster. `make verify` runs this; later tasks append plays.
- name: Verify node baseline
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read effective sshd settings
      ansible.builtin.command: sshd -T
      register: verify_sshd
      changed_when: false

    - name: Password and root login are off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in verify_sshd.stdout_lines"
          - "'permitrootlogin no' in verify_sshd.stdout_lines"

    - name: Read firewall status
      ansible.builtin.command: ufw status verbose
      register: verify_ufw
      changed_when: false

    - name: Firewall is on and denies by default
      ansible.builtin.assert:
        that:
          - "'Status: active' in verify_ufw.stdout"
          - "'deny (incoming)' in verify_ufw.stdout"
          - "'10.42.0.0/16' in verify_ufw.stdout"

- name: Verify the cluster
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read nodes with the Mac's kubeconfig
      ansible.builtin.command: kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/homelab.yaml get nodes -o json
      register: verify_nodes
      changed_when: false

    - name: Three nodes, all Ready
      vars:
        verify_ready: >-
          {{ (verify_nodes.stdout | from_json)['items']
             | map(attribute='status.conditions') | map('selectattr', 'type', 'equalto', 'Ready')
             | map('first') | map(attribute='status') | list }}
      ansible.builtin.assert:
        that:
          - verify_ready | length == 3
          - verify_ready | unique == ['True']

- name: Verify ley-khaa
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Dashboard is served at /
      ansible.builtin.uri:
        url: "http://{{ server_ip }}/"
        return_content: true
      register: verify_dashboard
      failed_when: "'<div id=\"root\">' not in verify_dashboard.content"

    - name: API answers through the frontend's /api proxy
      ansible.builtin.uri:
        url: "http://{{ server_ip }}/api/health"
        status_code: 200
