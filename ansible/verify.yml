# Assertions about the running cluster. `make verify` runs this; later tasks append plays.
- name: Verify node baseline
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read effective sshd settings
      ansible.builtin.command: sshd -T
      register: verify_sshd
      changed_when: false

    - name: Password and root login are off
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in verify_sshd.stdout_lines"
          - "'permitrootlogin no' in verify_sshd.stdout_lines"

    - name: Read firewall status
      ansible.builtin.command: ufw status verbose
      register: verify_ufw
      changed_when: false

    - name: Firewall is on and denies by default
      ansible.builtin.assert:
        that:
          - "'Status: active' in verify_ufw.stdout"
          - "'deny (incoming)' in verify_ufw.stdout"
          - "'{{ k3s_pod_cidr }}' in verify_ufw.stdout"

- name: Verify the cluster
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read nodes with the Mac's kubeconfig
      ansible.builtin.command: kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/homelab.yaml get nodes -o json
      register: verify_nodes
      changed_when: false

    - name: Three nodes, all Ready
      vars:
        verify_ready: >-
          {{ (verify_nodes.stdout | from_json)['items']
             | map(attribute='status.conditions') | map('selectattr', 'type', 'equalto', 'Ready')
             | map('first') | map(attribute='status') | list }}
      ansible.builtin.assert:
        that:
          - verify_ready | length == 3
          - verify_ready | unique == ['True']

- name: Verify ley-khaa
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Dashboard is served at /
      ansible.builtin.uri:
        url: "http://{{ server_ip }}/"
        return_content: true
      register: verify_dashboard
      failed_when: "'<div id=\"root\">' not in verify_dashboard.content"

    - name: API answers through the frontend's /api proxy
      ansible.builtin.uri:
        url: "http://{{ server_ip }}/api/health"
        status_code: 200

- name: Verify monitoring
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Grafana is healthy behind /grafana
      ansible.builtin.uri:
        url: "http://{{ server_ip }}/grafana/api/health"
        return_content: true
        status_code: 200
      register: verify_grafana

    # ley-khaa's own ingress answers 200 with its SPA for any unmatched path
    # (including /grafana if routing regresses), so status_code alone can't
    # tell them apart. verify_grafana.json is only populated by the uri module
    # when the body actually parses as JSON, so an SPA HTML response fails
    # this assert cleanly instead of erroring on the next line.
    - name: The response is Grafana's own health JSON, not ley-khaa's SPA
      ansible.builtin.assert:
        that:
          - verify_grafana.json is defined
          - verify_grafana.json.database == 'ok'

    - name: Loki is ready
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/homelab.yaml
        get --raw /api/v1/namespaces/monitoring/services/loki:3100/proxy/ready
      changed_when: false

    - name: Read Prometheus rules
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/homelab.yaml
        get --raw /api/v1/namespaces/monitoring/services/kps-prometheus:9090/proxy/api/v1/rules
      register: verify_rules
      changed_when: false

    - name: The OOM alert rule is loaded
      ansible.builtin.assert:
        that: "'ContainerOOMKilled' in verify_rules.stdout"
