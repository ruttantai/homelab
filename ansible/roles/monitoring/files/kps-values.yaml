# Short service names (kps-prometheus, kps-alertmanager) that scripts can rely on.
fullnameOverride: kps

grafana:
  # Credentials come from the pre-created grafana-admin Secret (see tasks/main.yml),
  # never from values: helm would otherwise echo the password in status.values,
  # and Ansible would echo it in module_args on any failure of this task.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    pathType: Prefix
    hosts: []
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up PrometheusRules that are not labelled for this Helm release (ours).
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# k3s runs these inside the k3s binary, not as scrapeable pods; scraping them
# only produces permanently firing "target down" alerts.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
