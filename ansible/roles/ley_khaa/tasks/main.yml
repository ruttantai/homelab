- name: Namespace and database Secret
  vars:
    ansible_python_interpreter: "{{ homelab_venv }}/bin/python"
    ley_khaa_db_password: >-
      {{ lookup('ansible.builtin.password', secrets_dir ~ '/postgres-password',
      chars=['ascii_letters', 'digits'], length=32) }}
  block:
    - name: Create the ley-khaa namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ k3s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ley-khaa

    # `data`, not `stringData`: the API never returns stringData, so comparing it
    # would report a change on every run.
    - name: Create the database Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ k3s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: ley-khaa-db
            namespace: ley-khaa
          data:
            password: "{{ ley_khaa_db_password | b64encode }}"
      no_log: true

- name: Copy the manifests to cp-1
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/ley-khaa/"
    dest: "{{ homelab_remote_dir }}/k8s/ley-khaa/"
    mode: "0644"
    directory_mode: "0755"

# `kubectl apply` always prints "configured" for the postgres StatefulSet, even with
# no real change, because the API server adds defaulted fields to volumeClaimTemplates
# that never appear in the last-applied-configuration annotation it diffs against
# (a long-standing kubectl limitation: kubernetes/kubernetes#73743). Parsing that
# stdout for changed_when would therefore report changed=1 on every run. `kubectl
# diff` is not affected, so it decides changed_when instead.
- name: Check whether the ley-khaa manifests differ from the cluster
  ansible.builtin.command: k3s kubectl diff -k {{ homelab_remote_dir }}/k8s/ley-khaa
  register: ley_khaa_diff
  changed_when: false
  failed_when: ley_khaa_diff.rc not in [0, 1]

- name: Apply the ley-khaa manifests
  ansible.builtin.command: k3s kubectl apply -k {{ homelab_remote_dir }}/k8s/ley-khaa
  register: ley_khaa_apply
  changed_when: ley_khaa_diff.rc == 1

- name: Wait for every ley-khaa workload to roll out
  ansible.builtin.command: k3s kubectl -n ley-khaa rollout status {{ item }} --timeout=300s
  loop:
    - statefulset/postgres
    - deploy/backend
    - deploy/frontend
  changed_when: false
